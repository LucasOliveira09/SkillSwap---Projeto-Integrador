version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: skillswap-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: skillswap-root-2026
      MYSQL_DATABASE: skillswap
      MYSQL_USER: skillswap
      MYSQL_PASSWORD: skillswap123
    volumes:
      - skillswap-mysql-data:/var/lib/mysql
    networks:
      - skillswap-internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uskillswap", "-pskillswap123"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillswap-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/skillswap?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: skillswap
      SPRING_DATASOURCE_PASSWORD: skillswap123
    networks:
      - skillswap-internal
      - oracle_default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    image: nginx:alpine
    container_name: skillswap-web
    restart: unless-stopped
    volumes:
      - ./frontend-dist:/usr/share/nginx/html:ro
      - ./nginx-spa.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - oracle_default
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  skillswap-mysql-data:

networks:
  skillswap-internal:
    driver: bridge
  oracle_default:
    external: true
