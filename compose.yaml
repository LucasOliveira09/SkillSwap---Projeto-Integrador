services:
  api:
    profiles: [app]
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/skillswap?serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8
      DB_USER: skillswap
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      SERVER_ADDRESS: 0.0.0.0
      SEED_ENABLED: ${SEED_ENABLED:-true}
      UPLOAD_DIR: /data/uploads
    depends_on:
      mysql: {condition: service_healthy}
    volumes:
      - skillswap-uploads:/data/uploads
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
  web:
    profiles: [app]
    build: {context: ., dockerfile: Dockerfile.frontend}
    ports: ["${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8088}:80"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 10s
      retries: 5
  mysql:
    image: mysql:8.4@sha256:0f51e63e537a1f176423fa03ef559aabe6fa4372a53160a44bc7e75da7d15364
    environment:
      MYSQL_DATABASE: skillswap
      MYSQL_USER: skillswap
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - skillswap-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

volumes:
  skillswap-mysql:
  skillswap-uploads:
