spring:
  application:
    name: skillswap-api
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/skillswap?serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8}
    username: ${DB_USER:skillswap}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1
    clean-disabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 3600000
skillswap:
  upload:
    directory: ${UPLOAD_DIR:uploads}
    user-quota-bytes: ${UPLOAD_USER_QUOTA_BYTES:104857600}
    orphan-retention-days: ${UPLOAD_ORPHAN_RETENTION_DAYS:30}
    cleanup-cron: ${UPLOAD_CLEANUP_CRON:0 30 3 * * *}
  seed:
    enabled: ${SEED_ENABLED:true}
