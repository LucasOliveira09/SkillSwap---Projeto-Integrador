spring:
  datasource:
    url: jdbc:h2:mem:skillswap;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

server:
  port: 8080

app:
  jwt:
    secret: skillswap-jwt-secret-key-2026-projeto-integrador-saptura-min-256bit
    expiration: 86400000
