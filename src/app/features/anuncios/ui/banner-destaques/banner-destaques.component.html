<section class="banner" aria-roledescription="carrossel" aria-label="Destaques SkillSwap">
  <div class="bilhete" aria-live="polite">
    <span class="circulo grande" aria-hidden="true"></span
    ><span class="circulo pequeno" aria-hidden="true"></span>
    <p class="chamada">{{ destaques[atual()].chamada }}</p>
    <h1>{{ destaques[atual()].titulo }}</h1>
    <p class="subtitulo">{{ destaques[atual()].descricao }}</p>
    <div class="indicadores" role="group" aria-label="Selecionar destaque">
      @for (destaque of destaques; track $index) {
        <button
          type="button"
          [class.ativo]="atual() === $index"
          (click)="atual.set($index)"
          [attr.aria-label]="'Mostrar destaque ' + ($index + 1)"
          [attr.aria-pressed]="atual() === $index"
        ></button>
      }
    </div>
  </div>
  <button class="seta anterior" type="button" aria-label="Destaque anterior" (click)="mover(-1)">
    <app-icone nome="esquerda" />
  </button>
  <button class="seta proximo" type="button" aria-label="Próximo destaque" (click)="mover(1)">
    <app-icone nome="direita" />
  </button>
</section>
